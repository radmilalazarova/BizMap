plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.radmila.businessdirectory'

    // ПРОБЛЕМ 1 — compileSdk беше напишан погрешно
    // compileSdk не е функција, туку едноставен број
    compileSdk 36

    defaultConfig {
        applicationId "com.radmila.businessdirectory"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // ПРОБЛЕМ 2 — activity.ktx е Kotlin библиотека
    // ти користиш Java, затоа замени со activity:
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // OkHttp
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // ViewPager2
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // Picasso
    // implementation 'com.squareup.picasso:picasso:2.8'

    implementation 'androidx.cardview:cardview:1.0.0'
}